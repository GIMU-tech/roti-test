<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame 101</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    *{box-sizing:border-box} body{margin:0;background:#ddd;font-family:Pretendard,Arial,sans-serif} .wrap{width:min(100%,860px);margin:0 auto;background:#f5f0e8;overflow:hidden;position:relative} .frame{position:relative;width:860px;height:3692px;transform-origin:top left} @media(max-width:860px){.frame{transform:scale(calc(100vw / 860));}.wrap{height:calc(3692px * (100vw / 860));}}
    .bg-grad{position:absolute;left:0;top:-1px;width:860px;height:1951px;background:linear-gradient(172deg,#453731 25%,rgba(69,55,49,.75) 51%,rgba(69,55,49,.5) 64%,rgba(69,55,49,0) 95%)}
    .card{position:absolute;left:58px;width:744px;background:#fff;border-radius:30px;box-shadow:0 0 12px rgba(177,116,87,.2)}
    .point{position:absolute;left:375px;width:110px;height:110px;border-radius:50%;background:#b17457;color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:.85}.point span:first-child{font-size:26px;font-weight:400;margin-bottom:13px}.point span:last-child{font-size:32px}
    .logo{position:absolute;top:139px;left:350px;width:160px;height:auto}.title1{position:absolute;top:263px;left:225px;color:#f5f0e8;font-size:50px}.title2{position:absolute;top:334px;left:149px;color:#f5f0e8;font-size:70px;font-weight:800;letter-spacing:-2px}.h{position:absolute;color:#453730;font-size:50px;font-weight:800;line-height:1.2}.p{position:absolute;color:#6f6f6f;font-size:30px;text-align:center;line-height:1.35}.p b{color:#4a4a4a}.photo{position:absolute;overflow:hidden;border-radius:20px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.brownbar{position:absolute;background:#b17457;color:#fff;text-align:center}.num{position:absolute;width:41px;height:41px;border-radius:50%;background:#b17457;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px}.num.light{background:#fff;color:#b17457}.label{position:absolute;background:#453731;color:#fff;text-align:center;font-size:18px;padding:1px 8px}.caption{position:absolute;background:#b17457;color:#fff;font-size:25px;text-align:center;line-height:38px}.caption.dark{background:#453730}.line{position:absolute;border-top:3px solid #453730;transform-origin:left center}.thin{border-top:2px solid #453730}.measure{position:absolute;color:#453730;font-weight:600;font-size:17px}.measure.dark{background:#453730;color:#fff;padding:3px 8px}.circleNote{position:absolute;left:179px;top:986px;width:126px;height:126px;border-radius:50%;background:rgba(177,116,87,.9);color:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;line-height:1.25}.circleNote b{font-size:21px}.grid{position:absolute;left:96px;top:2196px;width:667px;height:406px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden}.grid:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #fff}.grid:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #fff}.grid div{overflow:hidden}.grid img{width:100%;height:100%;object-fit:cover}.ellipse{position:absolute;border:2px solid #453730;border-radius:50%;transform:rotate(10deg)}
  </style>
</head>
<body>
<div class="wrap"><main class="frame">
  <div class="bg-grad"></div>
  <img class="logo" src="https://www.figma.com/api/mcp/asset/572b96c0-155c-4ec6-89c1-c7ff5f7c18bf" alt="르엘" />
  <div class="title1">르엘 식기건조대만의</div><div class="title2">‘퀄리티 높은 디테일’</div>

  <section class="card" style="top:573px;height:779px"></section><div class="point" style="top:512px"><span>POINT</span><span>01</span></div>
  <div class="h" style="top:678px;left:197px">1단만 넓은 2단은 그만!</div>
  <div class="p" style="top:755px;left:136px;width:603px">위아래 모두 넉넉하게 <b>1·2단 동일한</b> 대용량 사이즈</div>
  <div class="photo" style="left:96px;top:848px;width:667px;height:465px"><img src="https://www.figma.com/api/mcp/asset/120004e3-6468-46b3-84f2-9c512920298c" alt="식기건조대"></div>
  <div class="circleNote">310mm<br><b>동일 사이즈</b></div><div class="label" style="left:302px;top:928px">2단</div><div class="label" style="left:302px;top:1138px">1단</div>
  <div class="line" style="left:354px;top:939px;width:158px;transform:rotate(13.5deg)"></div><div class="line" style="left:350px;top:1152px;width:161px;transform:rotate(16deg)"></div>

  <section class="card" style="top:1501px;height:1199px"></section><div class="point" style="top:1446px"><span>POINT</span><span>02</span></div>
  <div class="h" style="top:1612px;left:159px">개별 구매 없는 풀 SET 구성</div>
  <div class="p" style="top:1689px;left:128px;width:603px">도마·컵 꽂이 부터 접시 꽂이, 수저통까지<br>옵션 고민 없는 실속 구성</div>
  <div class="photo" style="left:96px;top:1816px;width:667px;height:380px"><img src="https://www.figma.com/api/mcp/asset/216bf70d-048b-47d5-aadb-be1dc8805b0f" alt="풀세트"><img src="https://www.figma.com/api/mcp/asset/4096790a-1a0a-457b-93bd-1bc46680a506" alt="제품" style="position:absolute;left:40px;top:0;width:590px;height:380px;object-fit:contain"></div>
  <div class="num light" style="left:688px;top:1939px">3</div><div class="num light" style="left:517px;top:1914px">2</div><div class="num light" style="left:116px;top:1948px">1</div><div class="num light" style="left:279px;top:2132px">4</div>
  <div class="grid"><div><img src="https://www.figma.com/api/mcp/asset/86b37c50-e7ce-4b6d-b740-f04c884b2aa5"></div><div><img src="https://www.figma.com/api/mcp/asset/0461d43a-027c-4e06-8d97-a2b1ad29b876"></div><div><img src="https://www.figma.com/api/mcp/asset/1226ad4b-f261-48f1-a8f4-55deec24158d"></div><div><img src="https://www.figma.com/api/mcp/asset/d26941a4-de88-4def-9c95-599e31086b48"></div></div>
  <div class="num" style="left:107px;top:2208px">1</div><div class="num" style="left:443px;top:2208px">2</div><div class="num" style="left:107px;top:2409px">3</div><div class="num" style="left:443px;top:2409px">4</div>
  <div class="brownbar" style="left:96px;top:2602px;width:667px;height:59px;border-radius:0 0 20px 20px;font-size:23px;line-height:59px">본체 + ① 컵 꽂이, ② 접시 꽂이, ③ 와이드 바스켓, ④ 물 받침대</div>

  <section class="card" style="top:2849px;height:784px"></section><div class="point" style="top:2794px"><span>POINT</span><span>03</span></div>
  <div class="h" style="top:2960px;left:184px">필요하면 더 크게, 더 넓게</div><div class="p" style="top:3037px;left:172px;width:514px">슬라이드 확장 패널로 필요한만큼 연장 가능</div>
  <div class="photo" style="left:95px;top:3130px;width:667px;height:465px"><img src="https://www.figma.com/api/mcp/asset/cf49c7a8-31a0-4814-abcb-5a1087683684" alt="확장 패널"></div>
  <div class="measure" style="left:311px;top:3236px;transform:rotate(-14deg)">310mm</div><div class="measure dark" style="left:622px;top:3243px;transform:rotate(-16deg)">600mm</div>
  <div class="ellipse" style="left:455px;top:3352px;width:244px;height:136px"></div>
  <div class="caption" style="left:165px;top:3518px;width:194px;height:38px">확장 패널 사용 전</div><div class="caption dark" style="left:499px;top:3518px;width:194px;height:38px">확장 패널 사용 후</div>
</main></div>
</body>
</html>
